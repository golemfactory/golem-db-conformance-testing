# Arkiv-like blocks of ~128 KiB on average: mostly small entities (1-4 KB payloads) with some large ones
# (up to 100 KB), and updates that replace the whole entity.
name = "large-arkiv-blocks"
description = "Arkiv-like ~128 KiB blocks, 1-100 KB payloads: 150k blocks of creates, then 50k of 35% creates, 30% updates, 35% deletes"
seed = 6
commit_log = "results/large-arkiv-blocks.csv"
table_log = "results/large-arkiv-blocks-tables.csv"
table_log_every = 100
# Needs perf (see README, Profiling). Mid-fill in RAM, as the file reaches 128 GiB, the end of the fill,
# and twice in the steady phase:
profile_at = [50000, 110000, 150000, 175000, 200000]

[database]
hash = "keccak-256"
limits = { max_cell_name_len = 32, max_str_len = 64, max_bytes_len = 102400 }
max_map_size_gib = 512

[shape]
patch_all_cells = true                                                                          # updates replace the entity
attributes = [
    { name = "project", type = "str", cardinality = 50, distribution = "zipf", len = 16 },     # one per app, a few big apps
    { name = "entityType", type = "str", cardinality = 10, len = 12 },
    { name = "id", type = "str", distribution = "unique", len = 36 },                          # UUID-sized
    { name = "created", type = "u64", distribution = "unique" },                               # timestamp
    { name = "status", type = "str", cardinality = 4, len = 8 },
    { name = "ref", type = "str", cardinality = 10000, distribution = "zipf", len = 64 },     # key of another entity
]
fields = [{ name = "payload", type = "bytes", len = [
    { min = 1024, max = 4096, weight = 90 },
    { min = 4096, max = 102400, weight = 10 },
] }]

[workload]
kind = "blocks"
blocks = [
    { ops = 17, repeat = 150000 },                                                     # fill
    { ops = 26, repeat = 50000, mix = { create = 35, patch = 30, delete = 35 } },      # steady state
]
