# The large run with Arkiv-like entities: fill to 750k records, then 750k operations in a steady state
# where expirations (deletes) match creates, so the live data stops growing.
name = "large-realistic"
description = "750k Arkiv-like records (6 attributes, 1 KB payload), then 750 commits of 35% creates, 30% patches, 35% deletes"
seed = 5
commit_log = "results/large-realistic.csv"
table_log = "results/large-realistic-tables.csv"
# Needs perf (see README, Profiling):
profile_at = [1, 250, 750, 1100, 1500]

[database]
hash = "keccak-256"
limits = { max_cell_name_len = 32, max_str_len = 64, max_bytes_len = 1024 }
max_map_size_gib = 256

[shape]
attributes = [
    { name = "project", type = "str", cardinality = 50, distribution = "zipf", len = 16 },     # one per app, a few big apps
    { name = "entityType", type = "str", cardinality = 10, len = 12 },
    { name = "id", type = "str", distribution = "unique", len = 36 },                          # UUID-sized
    { name = "created", type = "u64", distribution = "unique" },                               # timestamp
    { name = "status", type = "str", cardinality = 4, len = 8 },
    { name = "ref", type = "str", cardinality = 10000, distribution = "zipf", len = 64 },     # key of another entity
]
fields = [{ name = "payload", type = "bytes", len = 1024 }]

[workload]
kind = "blocks"
blocks = [
    { ops = 1000, repeat = 750 },                                                      # fill: 750k records
    { ops = 1000, repeat = 750, mix = { create = 35, patch = 30, delete = 35 } },      # steady state
]
