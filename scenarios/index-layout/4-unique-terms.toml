# Same 50k records each; only [shape] differs.  Run all: cargo load scenarios/index-layout
name = "4-unique-terms"
description = "Every record writes a unique indexed value (a new posting list each)"
seed = 1

[database]
hash = "keccak-256"
limits = { max_cell_name_len = 32, max_str_len = 64, max_bytes_len = 1024 }

[shape]
# every record gets its own posting list
attributes = [{ name = "value", type = "u64", distribution = "unique" }]
fields = [{ name = "payload", type = "bytes", len = 256 }]

[workload]
kind = "blocks"
blocks = [{ ops = 1000, repeat = 50 }]
