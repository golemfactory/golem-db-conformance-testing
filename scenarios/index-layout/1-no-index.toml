# Same 50k records each; only [shape] differs.  Run all: cargo load scenarios/index-layout
name = "1-no-index"
description = "Baseline: nothing indexed (the value is a plain field)"
seed = 1

[database]
hash = "keccak-256"
limits = { max_cell_name_len = 32, max_str_len = 64, max_bytes_len = 1024 }

[shape]
# baseline: the value is a field, nothing is indexed
attributes = []
fields = [{ name = "value", type = "u64", distribution = "unique" }, { name = "payload", type = "bytes", len = 256 }]

[workload]
kind = "blocks"
blocks = [{ ops = 1000, repeat = 50 }]
